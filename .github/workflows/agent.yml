name: LinkedIn agent

on:
  schedule:
    - cron: "0 3 * * *"      # 8:30 AM IST: make today's 2 drafts and send them to Telegram
    - cron: "7,37 3-12 * * *" # backups in case GitHub skips a run (GitHub schedules are unreliable)
  workflow_dispatch:
    inputs:
      command:
        description: "auto = normal run, token-test = ask on Telegram before a test post, claude-check = test the Claude subscription token"
        type: choice
        options: [auto, watch, check, draft, token-test, image-check, claude-check]
        default: auto

# One run at a time, so two runs never change the saved state together.
concurrency:
  group: ${{ (inputs.command == 'image-check' || inputs.command == 'claude-check') && 'agent-test' || 'linkedin-agent' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets a run start the next run (see "Keep going" below)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      # Claude subscription token from `claude setup-token`. Not an API key.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fonts for the image card
        run: fc-list | grep -qi LiberationSansNarrow-Bold || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core)

      # Today's drafts, approval status and Telegram position live in drafts/,
      # carried from run to run with the Actions cache (not committed: the repo is public).
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: drafts
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Draft time?
        id: need
        run: |
          mkdir -p drafts
          if [ "${{ inputs.command }}" = "draft" ] || [ "${{ inputs.command }}" = "claude-check" ]; then echo "claude=true" >> "$GITHUB_OUTPUT"
          else echo "claude=$(python agent.py should-draft)" >> "$GITHUB_OUTPUT"; fi

      - name: Install Claude Code
        if: steps.need.outputs.claude == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Check Claude subscription token
        if: inputs.command == 'claude-check'
        run: env -u ANTHROPIC_API_KEY claude -p "Reply with just the word OK" --no-session-persistence

      # auto: make drafts after 8:30 if needed, then check Telegram every 30 s for ~50 min.
      - name: Run agent
        id: agent
        if: inputs.command != 'claude-check'
        run: |
          python agent.py ${{ inputs.command || 'auto' }}
          if [ "${{ inputs.command }}" = "draft" ]; then python agent.py watch; fi

      # GitHub often starts scheduled runs late or skips them. So while today's drafts are
      # waiting for YES, or an approved post is waiting for 9 AM / 6 PM, each run starts the next.
      - name: Keep going
        if: always() && steps.agent.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run agent.yml -R "$GITHUB_REPOSITORY" -f command=auto

      - name: Save state
        if: always() && inputs.command != 'image-check' && inputs.command != 'claude-check'
        uses: actions/cache/save@v4
        with:
          path: drafts
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
