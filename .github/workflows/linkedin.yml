name: LinkedIn Draft Agent

on:
  schedule:
    # GitHub cron runs in UTC. IST = UTC + 5:30
    - cron: "30 3 * * *"    # 9:00 AM IST  -> Post 1 (Problem)
    - cron: "30 12 * * *"   # 6:00 PM IST  -> Post 2 (Solution)
  workflow_dispatch:        # manual run from the Actions tab
    inputs:
      slot:
        description: "Which post to draft"
        required: true
        default: problem
        type: choice
        options:
          - problem
          - solution

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pick slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            echo "slot=problem" >> "$GITHUB_OUTPUT"
          else
            echo "slot=solution" >> "$GITHUB_OUTPUT"
          fi

      - name: Research, draft and send to Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: python agent.py

      # Drafts are kept as a build artifact (14 days), not committed to the repo.
      # Note: on a public repo, signed-in GitHub users can download artifacts.
      - name: Save draft
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ steps.slot.outputs.slot }}-${{ github.run_id }}
          path: drafts/
          if-no-files-found: ignore
          retention-days: 14
